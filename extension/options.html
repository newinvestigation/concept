<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>채팅창 타일러 - 레이아웃 관리</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>레이아웃 관리</h1>

    <div class="field">
      <label>기준 모니터</label>
      <select id="displaySelect"></select>
    </div>

    <div class="field">
      <label>행 겹침 % <span class="muted">(위 줄이 아래 줄 주소창 위로 겹치게)</span></label>
      <input type="number" id="overlapPercent" min="0" max="30" step="1" value="8" />
    </div>

    <div class="field">
      <label>프리셋으로 시작</label>
      <div class="preset-grid" id="presetGrid"></div>
    </div>

    <div class="field">
      <button id="addZoneBtn">+ 구역 추가</button>
      <button id="deleteZoneBtn" disabled>선택 구역 삭제</button>
    </div>

    <div class="field zone-detail" id="zoneDetail" hidden>
      <label class="section-label">선택된 구역 정밀 조정</label>
      <label>X %<input type="number" id="zoneX" min="0" max="100" step="0.5" /></label>
      <label>Y %<input type="number" id="zoneY" min="0" max="100" step="0.5" /></label>
      <label>너비 %<input type="number" id="zoneW" min="1" max="100" step="0.5" /></label>
      <label>높이 %<input type="number" id="zoneH" min="1" max="100" step="0.5" /></label>
    </div>

    <hr />

    <div class="field">
      <label>레이아웃 이름</label>
      <input type="text" id="layoutName" placeholder="예: 백호팀 4분할" />
      <button id="saveLayoutBtn" class="primary">현재 구성 저장</button>
    </div>

    <div class="field">
      <label>저장된 레이아웃</label>
      <ul id="savedLayoutList"><li class="empty">없음</li></ul>
    </div>
  </aside>

  <main class="stage-wrap">
    <p class="hint">사각형을 드래그하면 이동, 오른쪽 아래 모서리를 드래그하면 크기 조절됩니다. 클릭하면 선택됩니다. 구역의 번호 순서대로 팝업의 창 목록 1번, 2번…이 배치됩니다. 구역끼리 겹치게 만들면(직접 드래그하거나 "행 겹침 %" 사용) 화면에서 더 위쪽에 있는 구역이 항상 앞으로 오도록 자동 배치됩니다.</p>
    <div id="stage" class="stage"></div>
  </main>
</div>
<script src="common.js"></script>
<script src="options.js"></script>
</body>
</html>
